<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>کنکور لایتنر</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #0f1115; color: #f4f4f2;
         font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif; }
  main { text-align: center; padding: 2rem; max-width: 28rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .75rem; letter-spacing: -0.01em; }
  p { margin: 0; color: #a9adb5; line-height: 1.9; }
  .dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; background:#c9a227; margin-inline-start:.4rem; vertical-align:middle; }
</style>
</head>
<body>
<main>
  <h1>کنکور لایتنر<span class="dot"></span></h1>
  <p>واژه‌هایی که واقعاً در کنکور ارشد آمده‌اند، با روش لایتنر.</p>
  <p>به‌زودی.</p>
</main>
</body>
</html>
